version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devrag
    ports:
      - "5432:5432"
    volumes:
      - devrag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devrag-redis
    ports:
      - "6379:6379"
    volumes:
      - devrag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devrag_postgres_data:
  devrag_redis_data:
